server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # M3U / IPTV Proxy Endpoint (Tarayıcı CORS Engelini Çözer)
    location /proxy {
        # Kullanıcının girdiği URL parametresi decode edilir
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        
        # URL sorgu parametresini hedef adrese ilet
        if ($arg_url ~* "^https?://(.+)$") {
            set $target_url $arg_url;
            proxy_pass $target_url;
        }

        proxy_ssl_server_name on;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "*/*";
        
        # CORS Headers ekle
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
